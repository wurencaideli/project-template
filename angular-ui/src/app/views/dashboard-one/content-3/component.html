<div class="content-3-cp">
    <div class="head">
        <head-cp [title]="title()" />
    </div>
    <div class="filter">
        <div class="bt-list">
            @for (item of filters(); track item.label) {
                <div class="filter-btn" [class.active]="item.active" (click)="selectFilter(item)">
                    {{ item.label }}
                </div>
            }
        </div>
        <button type="button" class="refresh-btn" [title]="refreshLabel()" (click)="retryFetch()">
            <svg-icon name="rotate-ccw" svgSrcPath="assets/icon-images/" />
        </button>
    </div>
    <div class="chart">
        <define-chart-cp [isAuto]="true" [isAutoResize]="false" [options]="options()" [showLoading]="!!loadState().loading" />
        @if (loadState().error) {
            <div class="error">
                <span>{{ loadState().error }}</span>
                <div class="retry-btn" (click)="retryFetch()">{{ retryLabel() }}</div>
            </div>
        }
    </div>
</div>
