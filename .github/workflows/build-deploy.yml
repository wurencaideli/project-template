# 推送 master 触发:先构建三个子项目,产物通过 artifact 交给部署任务,再 rsync 到服务器并重启 PM2
name: 构建部署

on:
    push:
        branches:
            - master

# 同一时刻只允许一条部署流水线,避免并发部署交叉覆盖远端产物
concurrency:
    group: build-deploy
    cancel-in-progress: true

jobs:
    build:
        name: 构建
        runs-on: ubuntu-22.04
        steps:
            - name: 检出代码
              uses: actions/checkout@v4

            - name: 安装 pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: 配置 Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: 安装依赖
              run: |
                  cd web-admin
                  pnpm i
                  cd ../angular-ui
                  pnpm i
                  cd ../server
                  pnpm i

            - name: 构建 web-admin
              run: |
                  cd web-admin
                  npm run build

            - name: 构建 angular-ui
              run: |
                  cd angular-ui
                  npm run build

            - name: 构建 server
              run: |
                  cd server
                  npm run build

            - name: 整理部署产物
              run: |
                  mkdir -p __deploy
                  mkdir -p __deploy/web-admin/dist
                  mkdir -p __deploy/angular-ui/dist
                  mkdir -p __deploy/server/dist
                  cp -r web-admin/dist/. __deploy/web-admin/dist/
                  cp -r angular-ui/dist/. __deploy/angular-ui/dist/
                  cp -r server/dist/. __deploy/server/dist/
                  cp server/ecosystem.config.cjs __deploy/server/
                  cp server/package.json __deploy/server/
                  cp server/.env.* __deploy/server/

            - name: 上传部署产物
              uses: actions/upload-artifact@v4
              with:
                  name: deploy-files
                  path: __deploy/
                  retention-days: 3
                  if-no-files-found: error

    deploy:
        name: 部署
        runs-on: ubuntu-22.04
        needs: build
        # 声明部署环境,Actions 页面会多一条部署记录,后续可按需加审批保护
        environment: production
        steps:
            - name: 下载部署产物
              uses: actions/download-artifact@v4
              with:
                  name: deploy-files
                  path: __deploy/

            - name: 测试 SSH 连接
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.REMOTE_HOST }}
                  username: ${{ secrets.REMOTE_USER }}
                  key: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
                  port: 22
                  script: |
                      set -e
                      whoami
                      echo "SSH 连接正常"

            - name: 清理远端旧产物
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.REMOTE_HOST }}
                  username: ${{ secrets.REMOTE_USER }}
                  key: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
                  port: 22
                  script: |
                      set -e
                      rm -rf ${{ vars.REMOTE_DIR }}/web-admin/dist
                      rm -rf ${{ vars.REMOTE_DIR }}/angular-ui/dist

            - name: 同步文件到服务器
              uses: easingthemes/ssh-deploy@main
              with:
                  SSH_PRIVATE_KEY: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
                  ARGS: '-rlgoDzvc -i'
                  SOURCE: '__deploy/'
                  REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
                  REMOTE_USER: ${{ secrets.REMOTE_USER }}
                  TARGET: ${{ vars.REMOTE_DIR }}

            - name: 安装依赖并重启 PM2
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.REMOTE_HOST }}
                  username: ${{ secrets.REMOTE_USER }}
                  key: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
                  port: 22
                  script: |
                      set -e
                      echo "安装 server 依赖"
                      cd ${{ vars.REMOTE_DIR }}/server
                      pnpm i --prod

                      echo "重启 PM2 服务"
                      pm2 start ${{ vars.REMOTE_DIR }}/server/ecosystem.config.cjs --force
                      pm2 save
